<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TawanEchoes | Echoes Calculator</title>

<style>
:root {
  --pink: #ed65ad;
  --pink2: #fbe5f1;
  --text: #51364a;
  --muted: #8d7484;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  padding: 22px 14px;
  background: linear-gradient(135deg,#fff4fa,#f9e5f4);
  font-family: Arial,"Noto Sans Thai",sans-serif;
  color: var(--text);
}

.card {
  max-width: 440px;
  margin: 20px auto;
  background: white;
  border: 1px solid #f5d6e8;
  border-radius: 24px;
  padding: 24px;
  box-shadow: 0 12px 35px #e7b9d233;
}

.brand {
  text-align: center;
  color: var(--pink);
  font-weight: 800;
  font-size: 19px;
}

h1 {
  text-align: center;
  color: #d84c99;
  font-size: 27px;
  margin: 10px 0 22px;
}

label {
  display: block;
  font-weight: 700;
  margin: 16px 0 8px;
}

input, select {
  width: 100%;
  padding: 14px;
  border: 1px solid #ead6e2;
  border-radius: 13px;
  background: white;
  font-size: 16px;
  color: var(--text);
}

button {
  width: 100%;
  border: 0;
  border-radius: 14px;
  padding: 14px;
  background: var(--pink);
  color: white;
  font-weight: 700;
  font-size: 17px;
  margin-top: 20px;
  cursor: pointer;
}

.result {
  margin-top: 20px;
  text-align: center;
  background: var(--pink2);
  border-radius: 16px;
  padding: 18px;
}

.result small { color: var(--muted); }

.price {
  font-size: 30px;
  font-weight: 800;
  color: #d83d91;
  margin-top: 5px;
  overflow-wrap: anywhere;
}

.detail {
  margin-top: 14px;
  line-height: 1.8;
  font-size: 14px;
  white-space: pre-line;
}

.note {
  text-align: center;
  font-size: 12px;
  color: var(--muted);
  margin-top: 16px;
}
</style>
</head>

<body>
<main class="card">

  <div class="brand">♡ Tawan Top up ♡</div>
  <h1>คำนวณ Echoes</h1>

  <label for="mode">เลือกวิธีคำนวณ</label>
  <select id="mode">
    <option value="echoes">จากจำนวน Echoes</option>
    <option value="budget">จากงบที่มี (บาท)</option>
  </select>

  <label id="amountLabel" for="amount">
    ต้องการกี่ Echoes
  </label>

  <input
    id="amount"
    type="number"
    min="1"
    placeholder="เช่น 1518"
  >

  <button id="calculate">✨ คำนวณเลย</button>

  <div class="result" aria-live="polite">
    <small id="resultLabel">ราคาที่ต้องจ่าย</small>
    <div class="price" id="result">—</div>
    <div class="detail" id="detail"></div>
  </div>

  <p class="note">
    โปรดตรวจสอบราคาและจำนวน Echoes ก่อนสั่งซื้อ • TawanEchoes
  </p>

</main>

<script>
const packages = [
  { price: 30, echoes: 66, name: "30 บาท" },
  { price: 90, echoes: 203, name: "90 บาท" },
  { price: 145, echoes: 335, name: "145 บาท" }
];

const BIG_PACKAGE = 759;

function getBigPackagePrice(count) {
  if (count >= 30) return 283;
  if (count >= 20) return 285;
  if (count >= 10) return 287;
  return 290;
}

// คำนวณจำนวนแพ็กอื่นที่คุ้มที่สุด
function findBestSmallPackages(target) {
  const dp = Array(target + 1).fill(null);
  dp[0] = { cost: 0, counts: [0, 0, 0], echoes: 0 };

  for (let i = 0; i <= target; i++) {
    if (!dp[i]) continue;

    for (let p = 0; p < packages.length; p++) {
      const item = packages[p];
      const next = i + item.echoes;

      if (next > target) continue;

      const counts = [...dp[i].counts];
      counts[p]++;

      const candidate = {
        cost: dp[i].cost + item.price,
        counts,
        echoes: next
      };

      if (!dp[next] || candidate.cost < dp[next].cost) {
        dp[next] = candidate;
      }
    }
  }

  return dp;
}

// หาชุดแพ็กที่ราคาถูกที่สุด
function calculateBest(target) {
  let best = null;

  const maxBig = Math.ceil(target / BIG_PACKAGE) + 1;

  for (let bigCount = 0; bigCount <= maxBig; bigCount++) {
    const bigEchoes = bigCount * BIG_PACKAGE;
    const remaining = Math.max(0, target - bigEchoes);

    const dp = findBestSmallPackages(remaining);

    // เลือกจำนวนแพ็กเล็กที่ทำให้ได้ Echoes ถึงเป้าหมาย
    for (let i = remaining; i < dp.length; i++) {
      if (!dp[i]) continue;

      const bigPrice = getBigPackagePrice(bigCount);
      const totalCost = dp[i].cost + bigCount * bigPrice;
      const totalEchoes = bigEchoes + i;

      const candidate = {
        bigCount,
        bigPrice,
        smallCounts: dp[i].counts,
        totalCost,
        totalEchoes
      };

      if (
        !best ||
        candidate.totalCost < best.totalCost ||
        (
          candidate.totalCost === best.totalCost &&
          candidate.totalEchoes < best.totalEchoes
        )
      ) {
        best = candidate;
      }
    }
  }

  return best;
}

const mode = document.getElementById("mode");
const amount = document.getElementById("amount");
const amountLabel = document.getElementById("amountLabel");
const resultLabel = document.getElementById("resultLabel");
const result = document.getElementById("result");
const detail = document.getElementById("detail");

mode.addEventListener("change", () => {
  const budgetMode = mode.value === "budget";

  amountLabel.textContent = budgetMode
    ? "งบประมาณที่มี (บาท)"
    : "ต้องการกี่ Echoes";

  amount.placeholder = budgetMode
    ? "เช่น 580"
    : "เช่น 1518";

  resultLabel.textContent = budgetMode
    ? "จำนวน Echoes โดยประมาณ"
    : "ราคาที่ต้องจ่าย";

  result.textContent = "—";
  detail.textContent = "";
});

document.getElementById("calculate").addEventListener("click", () => {
  const value = Number(amount.value);

  if (!Number.isFinite(value) || value <= 0) {
    result.textContent = "กรุณากรอกจำนวนให้ถูกต้อง";
    detail.textContent = "";
    return;
  }

  if (mode.value === "budget") {
    // คำนวณจำนวน Echoes สูงสุดจากงบประมาณ
    const maxBudget = Math.floor(value);
    let best = { echoes: 0, cost: 0, detail: "" };

    for (let bigCount = 0; bigCount <= Math.floor(maxBudget / 283); bigCount++) {
      const bigPrice = getBigPackagePrice(bigCount);
      const remainingBudget = maxBudget - bigCount * bigPrice;

      const maxSmallEchoes = Math.floor(remainingBudget / 30) * 335;
      const dp = findBestSmallPackages(maxSmallEchoes);

      for (let i = 0; i < dp.length; i++) {
        if (!dp[i]) continue;

        const totalCost = bigCount * bigPrice + dp[i].cost;
        const totalEchoes = bigCount * BIG_PACKAGE + i;

        if (
          totalCost <= maxBudget &&
          totalEchoes > best.echoes
        ) {
          best = {
            echoes: totalEchoes,
            cost: totalCost,
            bigCount,
            bigPrice,
            smallCounts: dp[i].counts
          };
        }
      }
    }

    result.textContent =
      best.echoes.toLocaleString("th-TH") + " Echoes";

    detail.textContent =
      "ใช้เงิน " + best.cost.toLocaleString("th-TH") + " บาท\n" +
      (best.bigCount > 0
        ? "แพ็ก 759 ปุ่ม × " + best.bigCount +
          " = " + (best.bigCount * best.bigPrice) + " บาท\n"
        : "") +
      packages.map((p, i) =>
        p.name + " × " + best.smallCounts[i]
      ).join("\n");

    return;
  }

  const target = Math.ceil(value);
  const best = calculateBest(target);

  if (!best) {
    result.textContent = "ไม่สามารถคำนวณได้";
    detail.textContent = "";
    return;
  }

  result.textContent =
    best.totalCost.toLocaleString("th-TH") + " บาท";

  let lines = [];

  if (best.bigCount > 0) {
    lines.push(
      "แพ็ก 759 ปุ่ม × " + best.bigCount +
      " = " + (best.bigCount * best.bigPrice) +
      " บาท (" + best.bigPrice + " บาท/แพ็ก)"
    );
  }

  packages.forEach((p, i) => {
    if (best.smallCounts[i] > 0) {
      lines.push(
        p.name + " × " + best.smallCounts[i] +
        " = " + (p.price * best.smallCounts[i]) + " บาท"
      );
    }
  });

  lines.push(
    "รวม " + best.totalEchoes.toLocaleString("th-TH") +
    " Echoes"
  );

  detail.textContent = lines.join("\n");
});
</script>

</body>
</html>
